name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Runs clippy with -D warnings and the whole test suite. Both platforms,
      # because the capture layer is per-platform and only compiles on one of
      # them at a time.
      - run: nix build .#checks.${{ matrix.system }}.workspace -L

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # The firmware links a Rust staticlib built for riscv32imc; building it
      # here catches ABI or toolchain drift that the host tests cannot see.
      - name: Build dongle firmware
        run: |
          nix develop .#esp --command bash -c '
            cd firmware/dongle
            idf.py set-target esp32c3
            idf.py build
          '
