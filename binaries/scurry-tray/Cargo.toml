[package]
name = "scurry-tray"
description = "System tray app and settings pane for scurry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scurry-tray"
path = "src/main.rs"

[dependencies]
scurry-proto.workspace = true
scurry-ctl = { path = "../../crates/scurry-ctl" }
anyhow = "1"
tray-icon = "0.21"
winit = "0.30"
png = "0.17"
open = "5"
# The settings pane. Runs in its own process: winit permits exactly one event
# loop per process and the tray already owns one.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
