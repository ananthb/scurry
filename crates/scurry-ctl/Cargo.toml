[package]
name = "scurry-ctl"
description = "scurry controller: captures local input and routes it across the virtual desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
scurry-proto.workspace = true
scurry-layout.workspace = true
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Sets the tty to raw mode. Without that the line discipline would translate
# bytes inside our binary frames -- 0x0A in a coordinate becoming CRLF would
# silently corrupt pointer motion.
serialport = "4"
# The wireless control link: a BLE central talking to the dongle's custom GATT
# service. btleplug is async, so it brings a tokio runtime with it -- confined
# to one thread inside transport::ble, so nothing above it becomes async.
btleplug = "0.11"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
futures = "0.3"
uuid = "1"
# Firmware updates: fetching a release, and checking what came back.
# ureq is blocking and brings rustls with bundled roots, so it needs nothing
# from the host and does not drag another async runtime in beside tokio.
ureq = { version = "2", features = ["json", "tls"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
libc = "0.2"
