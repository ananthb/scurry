[workspace]
resolver = "2"
members = ["crates/scurry-proto", "crates/scurry-layout", "crates/scurry-ctl"]
# scurry-ffi is excluded: it is a no_std staticlib for riscv32imc and must not
# be built for the host by a bare `cargo build`.
exclude = ["crates/scurry-ffi"]

# Firmware lives in its own workspace under firmware/: it is no_std, targets
# riscv32imc (dongle) and xtensa (node), and must not inherit host dev-deps.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ananthb/scurry"

[workspace.dependencies]
scurry-proto = { path = "crates/scurry-proto" }
scurry-layout = { path = "crates/scurry-layout" }
